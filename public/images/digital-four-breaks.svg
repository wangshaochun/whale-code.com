<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img" aria-label="企业数字化的四处断点：立项到上线、上线到执行、执行到看板、看板到运营">
  <defs>
    <style>
      .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .t { font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; fill: #1e293b; }
      .title { font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 14px; font-weight: 600; fill: #0f172a; }
      .gap { font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 11px; fill: #b91c1c; }
      .note { font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 12px; fill: #64748b; }
      .link { stroke: #94a3b8; stroke-width: 1.5; }
      .bad { stroke: #ef4444; stroke-width: 2; fill: #ffffff; }
      .x { stroke: #ef4444; stroke-width: 1.8; }
    </style>
  </defs>

  <text x="20" y="34" class="title">四处断点：都不在系统里</text>

  <g>
    <rect x="20" y="100" width="130" height="64" rx="10" class="box" />
    <text x="85" y="137" text-anchor="middle" class="t">立项与选型</text>

    <rect x="177.5" y="100" width="130" height="64" rx="10" class="box" />
    <text x="242.5" y="137" text-anchor="middle" class="t">系统上线</text>

    <rect x="335" y="100" width="130" height="64" rx="10" class="box" />
    <text x="400" y="137" text-anchor="middle" class="t">业务执行</text>

    <rect x="492.5" y="100" width="130" height="64" rx="10" class="box" />
    <text x="557.5" y="137" text-anchor="middle" class="t">数据看板</text>

    <rect x="650" y="100" width="130" height="64" rx="10" class="box" />
    <text x="715" y="137" text-anchor="middle" class="t">持续运营</text>
  </g>

  <g>
    <line x1="150" y1="132" x2="177.5" y2="132" class="link" />
    <line x1="307.5" y1="132" x2="335" y2="132" class="link" />
    <line x1="465" y1="132" x2="492.5" y2="132" class="link" />
    <line x1="622.5" y1="132" x2="650" y2="132" class="link" />
  </g>

  <g>
    <circle cx="163.75" cy="132" r="9" class="bad" />
    <line x1="159.5" y1="127.75" x2="168" y2="136.25" class="x" />
    <line x1="168" y1="127.75" x2="159.5" y2="136.25" class="x" />

    <circle cx="321.25" cy="132" r="9" class="bad" />
    <line x1="317" y1="127.75" x2="325.5" y2="136.25" class="x" />
    <line x1="325.5" y1="127.75" x2="317" y2="136.25" class="x" />

    <circle cx="478.75" cy="132" r="9" class="bad" />
    <line x1="474.5" y1="127.75" x2="483" y2="136.25" class="x" />
    <line x1="483" y1="127.75" x2="474.5" y2="136.25" class="x" />

    <circle cx="636.25" cy="132" r="9" class="bad" />
    <line x1="632" y1="127.75" x2="640.5" y2="136.25" class="x" />
    <line x1="640.5" y1="127.75" x2="632" y2="136.25" class="x" />
  </g>

  <g stroke="#fca5a5" stroke-width="1.2" stroke-dasharray="3 4">
    <line x1="163.75" y1="196" x2="163.75" y2="145" />
    <line x1="321.25" y1="196" x2="321.25" y2="145" />
    <line x1="478.75" y1="196" x2="478.75" y2="145" />
    <line x1="636.25" y1="196" x2="636.25" y2="145" />
  </g>

  <g>
    <text x="163.75" y="212" text-anchor="middle" class="gap">只买功能</text>
    <text x="163.75" y="228" text-anchor="middle" class="gap">不改业务动作</text>

    <text x="321.25" y="212" text-anchor="middle" class="gap">审批在线</text>
    <text x="321.25" y="228" text-anchor="middle" class="gap">执行在线下</text>

    <text x="478.75" y="212" text-anchor="middle" class="gap">数据有了</text>
    <text x="478.75" y="228" text-anchor="middle" class="gap">口径不一致</text>

    <text x="636.25" y="212" text-anchor="middle" class="gap">验收合格</text>
    <text x="636.25" y="228" text-anchor="middle" class="gap">没人负责</text>
  </g>

  <text x="400" y="272" text-anchor="middle" class="note">每处断点，最后还是靠人用 Excel、微信群、临时取数补上。</text>
</svg>
