<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" role="img" aria-label="数据消费方式向上演进，下面是治理底座：指标中心、数据模型、数据集成与质量">
  <defs>
    <style>
      .card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .t { font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; fill: #1e293b; }
      .s { font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 11px; fill: #64748b; }
      .title { font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 600; fill: #0f172a; }
      .base-t { font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 12px; font-weight: 600; fill: #1e3a8a; }
      .note { font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 12px; fill: #64748b; }
      .dep { stroke: #93c5fd; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .arrow { stroke: #94a3b8; stroke-width: 1.5; }
    </style>
    <marker id="ahead" orient="auto" markerWidth="4" markerHeight="5" refX="3" refY="2.5">
      <path d="M0,0 V5 L4,2.5 Z" fill="#94a3b8" />
    </marker>
    <marker id="dhead" orient="auto" markerWidth="4" markerHeight="5" refX="3" refY="2.5">
      <path d="M0,0 V5 L4,2.5 Z" fill="#93c5fd" />
    </marker>
  </defs>

  <text x="20" y="30" class="title">消费方式在变，下面这一层不能省</text>

  <g class="card">
    <rect x="20" y="50" width="180" height="76" rx="10" />
    <rect x="220" y="50" width="180" height="76" rx="10" />
    <rect x="420" y="50" width="180" height="76" rx="10" />
    <rect x="620" y="50" width="180" height="76" rx="10" />
  </g>
  <g>
    <text x="110" y="78" text-anchor="middle" class="t">报表 / BI 看板</text>
    <text x="110" y="98" text-anchor="middle" class="s">问题固定，答案固定</text>

    <text x="310" y="78" text-anchor="middle" class="t">HTML 报告</text>
    <text x="310" y="98" text-anchor="middle" class="s">一页一个结论</text>

    <text x="510" y="78" text-anchor="middle" class="t">自然语言问数</text>
    <text x="510" y="98" text-anchor="middle" class="s">临时问题随手问</text>

    <text x="710" y="78" text-anchor="middle" class="t">企业级 Data Agent</text>
    <text x="710" y="98" text-anchor="middle" class="s">连库、带权限执行</text>
  </g>

  <g class="arrow" marker-end="url(#ahead)">
    <line x1="200" y1="88" x2="215" y2="88" />
    <line x1="400" y1="88" x2="415" y2="88" />
    <line x1="600" y1="88" x2="615" y2="88" />
  </g>

  <g class="dep" marker-end="url(#dhead)">
    <line x1="110" y1="126" x2="110" y2="235" />
    <line x1="310" y1="126" x2="310" y2="235" />
    <line x1="510" y1="126" x2="510" y2="235" />
    <line x1="710" y1="126" x2="710" y2="235" />
  </g>
  <rect x="20" y="240" width="780" height="180" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
  <text x="44" y="272" class="base-t">治理底座</text>
  <text x="776" y="272" text-anchor="end" class="s">没有这一层，上面全是猜</text>

  <line x1="44" y1="288" x2="776" y2="288" stroke="#dbeafe" stroke-width="1.5" />

  <text x="44" y="316" class="base-t">指标中心 · 语义层</text>
  <text x="776" y="316" text-anchor="end" class="s">口径、维度、业务规则</text>

  <line x1="44" y1="334" x2="776" y2="334" stroke="#dbeafe" stroke-width="1.5" />

  <text x="44" y="362" class="base-t">数据模型 · 主数据</text>
  <text x="776" y="362" text-anchor="end" class="s">客户、订单、产品、物料</text>

  <line x1="44" y1="380" x2="776" y2="380" stroke="#dbeafe" stroke-width="1.5" />

  <text x="44" y="406" class="base-t">数据集成 · 质量 · 权限</text>
  <text x="776" y="406" text-anchor="end" class="s">谁看过、错在哪、能不能追</text>

  <text x="410" y="452" text-anchor="middle" class="note">越往右走，越依赖下面的口径和权限。</text>
</svg>
